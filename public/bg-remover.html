<!DOCTYPE html>
<html>

<body>
    <img id="source" src="/dvc-logo-screen.jpg" style="display:none;" crossorigin="anonymous">
    <canvas id="canvas"></canvas>
    <div id="output">Processing...</div>
    <script>
        window.onload = function () {
            const img = document.getElementById('source');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // Calculate max brightness
                const max = Math.max(r, g, b);

                // Set alpha to the max brightness
                // This makes black (0,0,0) -> Alpha 0
                // Neon blue (0, 240, 255) -> Alpha 255
                data[i + 3] = max;

                // Color Correction:
                // Unmultiply alpha to recover original color intensity
                // If we display (0,0,255) with alpha 255, it stays (0,0,255).
                // If we display (0,0,128) with alpha 128... rendered on black it looks like (0,0,64).
                // We want the resulting pixel C_new * A = C_original.
                // So C_new = C_original / A.

                if (max > 0) {
                    data[i] = Math.min(255, (r / max) * 255);
                    data[i + 1] = Math.min(255, (g / max) * 255);
                    data[i + 2] = Math.min(255, (b / max) * 255);
                }
            }

            ctx.putImageData(imageData, 0, 0);

            const dataURL = canvas.toDataURL('image/png');
            document.getElementById('output').innerText = dataURL;
        };
    </script>
</body>

</html>
